<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Geospatial Webhook">
  <defs>
    <linearGradient id="peachToMint" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e98f6e"/>
      <stop offset="0.55" stop-color="#d56360"/>
      <stop offset="1" stop-color="#3e9763"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ccda3"/>
      <stop offset="1" stop-color="#3e9763"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fff5ee"/>
      <stop offset="1" stop-color="#ffe6d5"/>
    </radialGradient>
  </defs>

  <!-- Soft rounded backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#fff5ee"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ead7c0" stroke-width="1"/>

  <!-- Globe / mint circle -->
  <circle cx="32" cy="30" r="16" fill="url(#globe)"/>
  <path d="M16 30 Q24 24 32 30 T48 30" fill="none" stroke="#b7e1c4" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M16 34 Q24 28 32 34 T48 34" fill="none" stroke="#fbd0b5" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="32" cy="30" rx="16" ry="6" fill="none" stroke="#d8c2a3" stroke-width="1"/>

  <!-- Event arc (webhook signal) -->
  <path d="M16 18 Q32 6 48 18" fill="none" stroke="url(#peachToMint)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 3"/>

  <!-- Pin / location marker -->
  <g transform="translate(32,33)">
    <path d="M0 14 C-7 5 -7 -3 0 -8 C7 -3 7 5 0 14 Z"
          fill="url(#peachToMint)"
          stroke="#b85a39"
          stroke-width="0.8"
          stroke-linejoin="round"/>
    <circle cx="0" cy="-2" r="3.2" fill="#fff5ee" stroke="#b85a39" stroke-width="0.8"/>
  </g>

  <!-- Leaf accent (whimsical garden) -->
  <path d="M46 12 Q52 14 50 22 Q44 20 46 12 Z" fill="url(#leaf)"/>
  <path d="M46 12 Q48 17 49 21" fill="none" stroke="#2d7a4d" stroke-width="0.7" stroke-linecap="round"/>
</svg>
